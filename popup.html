<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{width:380px;font:14px system-ui;padding:12px;margin:0}
  button{width:100%;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
  button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  button:disabled{opacity:.45;cursor:not-allowed}
  #log{max-height:220px;overflow:auto;font-size:12px;color:#444;margin-top:8px;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
  <button id="load" class="primary">加载字幕</button>
  <button id="mark" disabled>标记当前画面时间</button>
  <button id="export" disabled>导出时间轴 JSON</button>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
